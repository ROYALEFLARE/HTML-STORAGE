<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML STORAGE — MR ROYALEFLARE</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#061018;color:#e9fbff}header{padding:18px 18px 12px;background:#081923;border-bottom:1px solid #17485b;position:sticky;top:0;z-index:5}h1{margin:0;color:#5eeaff;font-size:25px}header small{color:#8aaeba}.wrap{max-width:1000px;margin:auto;padding:18px}.topbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.search{flex:1;min-width:210px}.input,select,textarea{width:100%;background:#07131b;color:#e9fbff;border:1px solid #225466;border-radius:10px;padding:11px;outline:none}.search{padding:12px}.stats{color:#82a9b6;font-size:13px;margin:8px 0 16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.list .card{display:flex;align-items:center;gap:12px}.card{background:#0a1b25;border:1px solid #174457;border-radius:14px;padding:14px;box-shadow:0 4px 16px #0005}.icon{width:48px;height:48px;border-radius:10px;object-fit:cover;background:#07131b;border:1px solid #1d5368;display:block}.cardhead{display:flex;gap:10px;align-items:center}.meta{flex:1;min-width:0}.name{font-weight:bold;word-break:break-word}.date{font-size:11px;color:#7897a2;margin-top:3px}.badge{display:inline-block;font-size:10px;border:1px solid #276477;border-radius:20px;padding:3px 7px;color:#69e9ff;margin-top:5px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #276477;background:#0b2530;color:#dffaff;border-radius:9px;padding:8px 10px;cursor:pointer}.btn:hover{background:#123746}.primary{background:#0e647a}.danger{border-color:#75404a}.fab{position:fixed;bottom:24px;width:54px;height:54px;border:0;border-radius:50%;background:#5eeaff;color:#00141b;font-size:28px;font-weight:bold;z-index:20;box-shadow:0 8px 25px #0008;cursor:pointer}.addFab{right:20px}.menuFab{left:20px;font-size:23px}.menu{position:fixed;left:20px;bottom:88px;width:235px;background:#081923;border:1px solid #205469;border-radius:14px;padding:8px;display:none;z-index:19;box-shadow:0 12px 35px #0009}.menu.show{display:block}.menu button{width:100%;text-align:left;background:transparent;border:0;color:#dffaff;padding:11px;border-radius:9px;cursor:pointer}.menu button:hover{background:#102c38}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:15px;z-index:30}.modal.show{display:flex}.box{width:min(760px,100%);max-height:90vh;overflow:auto;background:#081923;border:1px solid #286076;border-radius:16px;padding:18px}.field{margin:11px 0}.field label{display:block;color:#90b8c5;font-size:12px;margin-bottom:6px}.code{min-height:300px;font-family:monospace;resize:vertical}.preview{width:100%;height:65vh;border:1px solid #25566a;background:white;border-radius:10px}.empty{text-align:center;padding:50px 20px;color:#7596a1;border:1px dashed #214b5c;border-radius:14px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#dffaff;color:#00141b;padding:10px 14px;border-radius:10px;display:none;z-index:50;font-size:13px}.hidden{display:none}.checkrow{display:flex;gap:10px;align-items:center;color:#a7c4cc}.dangerText{color:#ff9da8}.sectionTitle{margin:5px 0 10px;color:#5eeaff}
</style></head><body>
<header><div class="wrap"><h1>HTML STORAGE</h1><small>BY MR ROYALEFLARE</small></div></header><main class="wrap"><div class="topbar"><input id="search" class="input search" placeholder="Search files..."><select id="sort" style="width:150px"><option value="new">Newest</option><option value="old">Oldest</option><option value="az">A-Z</option><option value="za">Z-A</option><option value="fav">Favorites</option></select><button class="btn" id="viewBtn">List view</button></div><div id="stats" class="stats"></div><div id="files" class="grid"></div></main>
<button id="menuFab" class="fab menuFab">☰</button><button id="addFab" class="fab addFab">+</button>
<div id="menu" class="menu"><button onclick="openUpload()">Upload HTML file</button><button onclick="openCode()">Add by code</button><hr><button onclick="openExtractor()">Code Extractor</button><button onclick="backup()">Backup storage</button><button onclick="restoreInput.click()">Restore backup</button><button onclick="createSample()">Create sample HTML</button><button onclick="duplicateFavorite()">Duplicate favorite</button><button onclick="toggleTheme()">Toggle theme</button><button onclick="openSettings()">Settings</button><hr><button onclick="openRunner()">Our Code Runner</button><button onclick="openYoutube()">YouTube</button></div>
<input id="restoreInput" type="file" accept="application/json" class="hidden">
<div id="modal" class="modal"><div id="box" class="box"></div></div><div id="toast" class="toast"></div>
<script>
const KEY='mr_royaleflare_html_storage_v3';let data=JSON.parse(localStorage.getItem(KEY)||'[]');let editing=null;let list=false;const $=id=>document.getElementById(id);
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function iconSvg(name){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" rx="18" fill="#0e647a"/><text x="50" y="60" text-anchor="middle" font-size="42" fill="white">&lt;/&gt;</text></svg>')}
function render(){let q=$('search').value.toLowerCase();let arr=data.filter(x=>x.name.toLowerCase().includes(q));let sort=$('sort').value;if(sort==='new')arr.sort((a,b)=>b.updated-a.updated);if(sort==='old')arr.sort((a,b)=>a.updated-b.updated);if(sort==='az')arr.sort((a,b)=>a.name.localeCompare(b.name));if(sort==='za')arr.sort((a,b)=>b.name.localeCompare(a.name));if(sort==='fav')arr.sort((a,b)=>Number(b.favorite)-Number(a.favorite)||b.updated-a.updated);$('stats').textContent=`${data.length} file${data.length===1?'':'s'} • ${data.filter(x=>x.favorite).length} favorite${data.filter(x=>x.favorite).length===1?'':'s'} • Stored in this browser`;$('files').className=(list?'grid list':'grid');$('viewBtn').textContent=list?'Grid view':'List view';if(!arr.length){$('files').innerHTML='<div class="empty">No saved HTML files yet.<br>Tap + to add one.</div>';return}$('files').innerHTML=arr.map(x=>`<article class="card"><div class="cardhead"><img class="icon" src="${x.icon||iconSvg(x.name)}"><div class="meta"><div class="name">${esc(x.name)} <span class="star" onclick="fav('${x.id}')">${x.favorite?'★':'☆'}</span></div><div class="date">Updated ${new Date(x.updated).toLocaleString()}</div>${x.size?`<span class="badge">${x.size} KB</span>`:''}</div></div><div class="actions"><button class="btn primary" onclick="openFile('${x.id}')">Open</button><button class="btn" onclick="editFile('${x.id}')">Edit</button><button class="btn" onclick="renameFile('${x.id}')">Rename</button><button class="btn" onclick="fileInfo('${x.id}')">Info</button><button class="btn" onclick="sendFile('${x.id}')">Send</button><button class="btn" onclick="downloadFile('${x.id}')">Download</button><button class="btn" onclick="duplicate('${x.id}')">Duplicate</button><button class="btn danger" onclick="deleteFile('${x.id}')">Delete</button></div></article>`).join('')}
function openModal(html){$('box').innerHTML=html;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show');editing=null}
function baseForm(title,name='',code='',icon=''){return `<h2>${title}</h2><div class="field"><label>File name</label><input id="fname" class="input" value="${esc(name)}" placeholder="my-page.html"></div><div class="field"><label>Custom icon (optional)</label><input id="ficon" class="input" type="file" accept="image/*"></div><div class="field"><label>HTML code</label><textarea id="fcode" class="input code" placeholder="<!DOCTYPE html>...">${esc(code)}</textarea></div><div class="actions"><button class="btn primary" onclick="runForm()">Run</button><button class="btn" onclick="saveForm()">Save</button><button class="btn" onclick="closeModal()">Cancel</button></div>`}
function openUpload(){closeMenu();openModal(`<h2>Add HTML File</h2><div class="field"><label>Choose HTML file</label><input id="htmlFile" class="input" type="file" accept=".html,.htm,text/html"></div><div class="field"><label>File name</label><input id="fname" class="input" placeholder="my-page.html"></div><div class="field"><label>Custom icon (optional)</label><input id="ficon" class="input" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml"></div><div class="actions"><button class="btn primary" onclick="loadHtmlFile()">Load file</button><button class="btn" onclick="closeModal()">Cancel</button></div><div id="uploadPreview"></div>`)}function openCode(){closeMenu();openModal(baseForm('Add by Code'))}
function loadHtmlFile(){let f=$('htmlFile').files[0];if(!f)return toast('Choose an HTML file first');let r=new FileReader();r.onload=()=>{let name=$('fname');if(!name.value)name.value=f.name;$('uploadPreview').innerHTML=`<div class="field"><label>HTML loaded — edit if needed</label><textarea id="fcode" class="input code">${esc(r.result)}</textarea></div><div class="actions"><button class="btn primary" onclick="saveUpload()">Save HTML</button><button class="btn" onclick="runForm()">Run</button></div>`};r.readAsText(f)}
async function readIcon(){let f=$('ficon')?.files[0];if(!f)return '';return await new Promise(r=>{let a=new FileReader();a.onload=()=>r(a.result);a.readAsDataURL(f)})}
async function saveForm(){let name=$('fname').value.trim()||'untitled.html';if(!name.toLowerCase().endsWith('.html'))name+='.html';let code=$('fcode').value;let ic=await readIcon();data.push({id:crypto.randomUUID(),name,code,icon:ic,updated:Date.now(),favorite:false,size:Math.max(1,Math.round(code.length/1024))});save();closeModal();toast('HTML file saved')}
async function saveUpload(){if(!$('fcode'))return toast('Load the HTML file first');await saveForm()}
function editFile(id){let x=data.find(a=>a.id===id);editing=id;openModal(baseForm('Edit HTML File',x.name,x.code,x.icon));$('box').querySelector('.primary').onclick=runForm;$('box').querySelectorAll('.btn')[1].onclick=saveEdit}
async function saveEdit(){let x=data.find(a=>a.id===editing);if(!x)return;x.name=$('fname').value.trim()||x.name;if(!x.name.toLowerCase().endsWith('.html'))x.name+='.html';x.code=$('fcode').value;let ic=await readIcon();if(ic)x.icon=ic;x.updated=Date.now();x.size=Math.max(1,Math.round(x.code.length/1024));save();closeModal();toast('Changes saved')}
function runForm(){let code=$('fcode').value;let w=window.open();if(w){w.document.open();w.document.write(code);w.document.close()}else toast('Popup blocked by browser')}
function openFile(id){let x=data.find(a=>a.id===id);openModal(`<h2>${esc(x.name)}</h2><iframe class="preview" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe><div class="actions"><button class="btn primary" onclick="runStored('${id}')">Open in browser</button><button class="btn" onclick="downloadFile('${id}')">Download</button><button class="btn" onclick="editFile('${id}')">Edit</button><button class="btn" onclick="closeModal()">Close</button></div>`);let fr=$('box').querySelector('iframe');fr.srcdoc=x.code}
function runStored(id){let x=data.find(a=>a.id===id),w=window.open();if(w){w.document.write(x.code);w.document.close()}}
function downloadFile(id){let x=data.find(a=>a.id===id),b=new Blob([x.code],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=x.name;a.click();URL.revokeObjectURL(a.href);toast('Downloaded '+x.name)}
function deleteFile(id){let x=data.find(a=>a.id===id);if(confirm('Delete '+x.name+' from HTML STORAGE?')){data=data.filter(a=>a.id!==id);save();toast('File deleted')}}
function fav(id){let x=data.find(a=>a.id===id);x.favorite=!x.favorite;save();toast(x.favorite?'Added to favorites':'Removed from favorites')}
function duplicate(id){let x=data.find(a=>a.id===id);data.push({...x,id:crypto.randomUUID(),name:x.name.replace(/\.html$/i,'')+' copy.html',updated:Date.now(),favorite:false});save();toast('File duplicated')}
function duplicateFavorite(){closeMenu();let x=data.find(a=>a.favorite);if(x)duplicate(x.id);else toast('Favorite a file first')}
async function sendFile(id){let x=data.find(a=>a.id===id),f=new File([x.code],x.name,{type:'text/html'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]}))){try{await navigator.share({title:x.name,text:'HTML file shared from HTML STORAGE',files:[f]})}catch(e){}}else{downloadFile(id);toast('Sharing is not supported here, so the file was downloaded') }}
function openExtractor(){closeMenu();openModal(`<h2>Code Extractor</h2><p style="color:#8faeb8">Upload an HTML file to extract its source. Public URLs only work when the website allows browser CORS access.</p><div class="field"><label>HTML file</label><input id="extractFile" class="input" type="file" accept=".html,text/html"></div><div class="actions"><button class="btn primary" onclick="extractFile()">Extract file code</button></div><div class="field"><label>Public URL</label><input id="extractUrl" class="input" placeholder="https://example.com"></div><button class="btn" onclick="extractUrl()">Inspect URL</button><div class="field"><label>Extracted code</label><textarea id="extractOut" class="input code" readonly></textarea></div><div class="actions"><button class="btn" onclick="copyExtracted()">Copy code</button><button class="btn" onclick="closeModal()">Close</button></div>`)}
function extractFile(){let f=$('extractFile').files[0];if(!f)return toast('Choose an HTML file first');let r=new FileReader();r.onload=()=>{$('extractOut').value=r.result};r.readAsText(f)}
async function extractUrl(){let u=$('extractUrl').value.trim();if(!u)return toast('Enter a URL');try{let r=await fetch(u);if(!r.ok)throw 0;$('extractOut').value=await r.text()}catch(e){$('extractOut').value='';toast('URL blocked by browser CORS. Upload the HTML file instead.')}}
async function copyExtracted(){let t=$('extractOut').value;if(!t)return toast('Nothing to copy');try{await navigator.clipboard.writeText(t)}catch(e){$('extractOut').select();document.execCommand('copy')}toast('Code copied')}
function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='HTML_STORAGE_backup.json';a.click();toast('Backup downloaded')}
$('restoreInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result);if(!Array.isArray(j))throw 0;data=j;save();toast('Backup restored')}catch(_){toast('Invalid backup file')}};r.readAsText(f);e.target.value=''}
function createSample(){let code='<!DOCTYPE html>\n<html>\n<head><title>My HTML</title></head>\n<body><h1>Hello from HTML STORAGE</h1><p>Edit me!</p></body>\n</html>';data.push({id:crypto.randomUUID(),name:'sample.html',code,icon:iconSvg(''),updated:Date.now(),favorite:false,size:1});save();closeMenu();toast('Sample created')}
function fileInfo(id){let x=data.find(a=>a.id===id);if(!x)return;let lines=x.code.split('\n').length;let chars=x.code.length;let words=x.code.trim()?x.code.trim().split(/\s+/).length:0;openModal(`<h2>File Info</h2><p><b>Name:</b> ${esc(x.name)}</p><p><b>Size:</b> ${Math.max(1,Math.round(chars/1024))} KB</p><p><b>Lines:</b> ${lines}</p><p><b>Characters:</b> ${chars}</p><p><b>Words:</b> ${words}</p><p><b>Updated:</b> ${new Date(x.updated).toLocaleString()}</p><div class="actions"><button class="btn" onclick="closeModal()">Close</button></div>`)}
function renameFile(id){let x=data.find(a=>a.id===id);let n=prompt('New file name:',x.name);if(n===null)return;n=n.trim()||x.name;if(!/\.html?$/i.test(n))n+='.html';x.name=n;x.updated=Date.now();save();toast('File renamed')}
function clearSearch(){if($('search').value){$('search').value='';render()}$('search').focus()}
function openSettings(){closeMenu();openModal(`<h2>Settings</h2><h3 class="sectionTitle">Storage</h3><p>${data.length} HTML file(s) are saved in this browser's local storage.</p><div class="actions"><button class="btn" onclick="backup()">Backup data</button><button class="btn" onclick="restoreInput.click()">Restore data</button></div><h3 class="sectionTitle">Danger zone</h3><p class="dangerText">Clear all files stored by this app. Downloaded copies on your phone are not affected.</p><button class="btn danger" onclick="clearAll()">Clear all app data</button><div class="actions"><button class="btn" onclick="closeModal()">Close</button></div>`)}
function clearAll(){if(confirm('Clear ALL HTML STORAGE files?')){data=[];save();closeModal();toast('All app data cleared')}}
function openRunner(){closeMenu();window.open('https://royaleflare.github.io/ROYALEFLARE-CODE-RUNNER-V-1.9/','_blank')}
function openYoutube(){closeMenu();window.open('https://youtube.com/@mrroyaleflare?si=SzarfBWC4eOHtVht','_blank')}
function toggleTheme(){document.body.classList.toggle('light');let light=document.body.classList.contains('light');document.body.style.background=light?'#eefaff':'#061018';document.body.style.color=light?'#05202a':'#e9fbff';toast(light?'Light background on':'Dark background on');closeMenu()}
function closeMenu(){$('menu').classList.remove('show')}
$('addFab').onclick=()=>{closeMenu();openModal(`<h2>Add HTML</h2><div class="actions" style="display:grid"><button class="btn primary" onclick="openUpload()">Upload HTML file</button><button class="btn primary" onclick="openCode()">Add by code</button></div><p style="color:#8faeb8">Only file-adding options are here. Other tools are in the ☰ menu.</p>`)};$('menuFab').onclick=()=>$('menu').classList.toggle('show');$('search').oninput=render;$('sort').onchange=render;$('viewBtn').onclick=()=>{list=!list;render()};$('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};render();
</script></body></html>
